[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-incremental-ci"
version = "0.2.0"
description = "Guarded native Lean commands and compatible check progress"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lean-ci = "lean_ci.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_ci*"]
