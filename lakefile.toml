name = "Aglib"
version = "0.1.0"
description = "General commutative algebra, scheme geometry, and coherent cohomology."
keywords = ["math", "algebraic-geometry", "commutative-algebra", "cohomology"]
license = "Apache-2.0"
defaultTargets = ["Aglib", "AglibTest"]
testDriver = "AglibTest"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Aglib"]
builtinLint = true

[[lean_lib]]
name = "Aglib"
leanOptions = {autoImplicit = false, weak.linter.mathlibStandardSet = true, weak.linter.style.longFile = 1500, warningAsError = true}

[[lean_lib]]
name = "AglibTest"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"
