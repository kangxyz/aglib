            if timeout --kill-after=30s 20m env LEAN_ABORT_ON_PANIC=1 "${lint_command[@]}"; then
              exit 0
            else
              status=$?
            fi
            if test "$status" -ne 124 || test "$attempt" -eq 2; then
              exit "$status"
            fi
            echo '::warning::Declaration lint timed out; retrying once.'
          done
      - name: Audit production axioms
        id: axioms
        if: ${{ !cancelled() && needs.build.result == 'success' && (steps.lean-setup.outcome == 'success' || steps.lean-setup-local.outcome == 'success') && steps.compiled.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a roots <<< "$BUILD_TARGETS"
          if test "${#roots[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          # Reuse the pinned source and incremental outputs across Test runs.
          tool="$LAKE_CACHE_DIR/axiom-audit"
          if ! test -d "$tool/.git"; then
            # A scoped tools checkpoint can restore .lake without source/.git.
            auditor_source=$(mktemp -d "$RUNNER_TEMP/axiom-audit-source.XXXXXX")
            trap 'rm -rf "$auditor_source"' EXIT
            git clone --depth 1 --branch v0.1.2 https://github.com/leanprover-community/axiom-audit.git "$auditor_source/checkout"
            test "$(git -C "$auditor_source/checkout" rev-parse HEAD)" = 46024e005996495c65ef609368e11ab39c4222e3
            mkdir -p "$tool"
            cp -a "$auditor_source/checkout/." "$tool/"
          fi
          test "$(git -C "$tool" rev-parse HEAD)" = 46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain "$tool/lean-toolchain"
          (cd "$tool" && lake build)
          test -x "$tool/.lake/build/bin/axiom-audit"
          result=0
          for root in "${roots[@]}"; do
            lake env "$tool/.lake/build/bin/axiom-audit" --root "$root" || result=1
          done
          exit "$result"
      - name: Quiesce this job's native scopes before cache saving
        id: quiesce
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: *quiesce-native-scopes
      - name: Save completed Test compilation
        if: ${{ always() && needs.build.outputs.local-handoff != 'true' && inputs.first-ci-cache == '' && steps.cache-mode.outputs.layered != 'true' && steps.quiesce.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
            ${{ runner.temp }}/lake-native-cache
          key: ${{ needs.build.outputs.cache-key }}-tests-${{ github.run_attempt }}
      - name: Pack completed root checkpoint
        id: pack-root
        if: ${{ always() && steps.cache-mode.outputs.layered == 'true' && steps.quiesce.outcome == 'success' && steps.compiled.outcome == 'success' }}
        shell: bash
        working-directory: ${{ inputs.package-directory }}
        run: |
          python3 .github/ci-cache/checkpoint.py pack --root . --layer root \
            --output "$RUNNER_TEMP/layered-cache/root.tar.zst" --native-cache "$LAKE_CACHE_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Save completed root checkpoint
        if: ${{ always() && steps.quiesce.outcome == 'success' && steps.pack-root.outcome == 'success' && steps.compiled.outcome == 'success' && (needs.build.outputs.local-handoff != 'true' || steps.pack-root.outputs.generation != needs.build.outputs.root-generation) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/root.tar.zst
          key: lean-layered-v1-root-${{ steps.cache-mode.outputs.root_context }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}-test
      - name: Pack completed tools checkpoint
        id: pack-tools
        if: ${{ always() && steps.cache-mode.outputs.layered == 'true' && steps.quiesce.outcome == 'success' && steps.compiled.outcome == 'success' }}
        shell: bash
        working-directory: ${{ inputs.package-directory }}
        run: |
          python3 .github/ci-cache/checkpoint.py pack --root . --layer tools \
            --output "$RUNNER_TEMP/layered-cache/tools.tar.zst" --native-cache "$LAKE_CACHE_DIR" \
            --github-output "$GITHUB_OUTPUT"
      - name: Save completed tools checkpoint
        if: ${{ always() && steps.quiesce.outcome == 'success' && steps.pack-tools.outcome == 'success' && (steps.pack-tools.outputs.changed == 'true' || (needs.build.outputs.local-handoff != 'true' && steps.restore-tools.outputs.cache-matched-key == '')) && steps.compiled.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/tools.tar.zst
          key: lean-layered-v1-tools-${{ steps.cache-mode.outputs.tools_context }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop native resource sampler
        if: ${{ always() && (needs.build.outputs.local-handoff != 'true' || steps.lean-setup-local.outcome == 'success') }}
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ inputs.package-directory }}
        run: |
          if test -f .github/ci-resource-monitor.py; then
            python3 .github/ci-resource-monitor.py stop
          fi
      - name: Upload native resource observations
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-resources-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: ${{ runner.temp }}/lean-ci-resources/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/resources.jsonl
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7
      - name: Report Test, lint and axiom results
        if: ${{ always() }}
        env:
          COMPILED: ${{ steps.compiled.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          IMPORTS: ${{ steps.imports.outcome }}
          STYLE: ${{ steps.style.outcome }}
          TEST: ${{ steps.test.outcome }}
          LINT: ${{ steps.lint.outcome }}
          AXIOMS: ${{ steps.axioms.outcome }}
        run: |
          row() {
            case "$2" in
              success) status='✅ Passed' ;;
              failure) status='❌ Failed' ;;
              cancelled) status='⏹ Cancelled' ;;
              *) status='— Skipped' ;;
            esac
            printf '| %s | %s |\n' "$1" "$status"
          }
          {
            printf '## Verification\n\n| Check | Result |\n| --- | --- |\n'
            row 'Production outputs' "$COMPILED"
            row 'Checker tools' "$TOOLS"
            row 'Generated library entries' "$IMPORTS"
            row 'Mathlib text style' "$STYLE"
            row 'Package tests' "$TEST"
            row 'Declaration lint' "$LINT"
            row 'Production axiom audit' "$AXIOMS"
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$COMPILED" = success && test "$TOOLS" = success && test "$IMPORTS" = success && test "$STYLE" = success && test "$TEST" = success && test "$LINT" = success && test "$AXIOMS" = success
      - name: Check publication archive identity
        if: &publish-local-stage ${{ needs.build.outputs.local-handoff == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        working-directory: ${{ inputs.package-directory }}
        env:
          BUILD_STAGE_SHA: ${{ needs.build.outputs.stage-sha }}
        run: printf '%s  %s\n' "$BUILD_STAGE_SHA" '.lake/ci-host-handoff/lake-native-cache.tar' | sha256sum -c -
      - name: Upload verified native outputs for publication
        if: *publish-local-stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-staging
          overwrite: true
          path: ${{ inputs.package-directory }}/.lake/ci-host-handoff/lake-native-cache.tar
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0

  upload_cache:
    name: Publish cache
    needs: [build, test_lint]
    if: ${{ needs.build.result == 'success' && needs.test_lint.result == 'success' && needs.build.outputs.staged == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: lean-cache-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ inputs.first-ci-cache != '' }}
        with:
          persist-credentials: false
      - name: Admit mandatory Publish stage download
        if: ${{ inputs.first-ci-cache != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/cache-promotion/ci-resources.py publish-download
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: cache-staging
      - name: Publish staged compilation
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache }}
        run: |
          domain=$(tar -xOf lake-native-cache.tar ./producer.json | jq -er \
            --arg repository "$REPOSITORY" --arg revision "$REVISION" \
            'select(.repository == $repository and .revision == $revision).domain')
          ASSET="lake-native-cache-$domain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar"
          tag="lean-native-$REVISION"
          mv lake-native-cache.tar "$ASSET"
          if test -n "$FIRST_CI_CACHE"; then
            python3 .github/cache-promotion/ci-resources.py publish-upload "$ASSET"
          fi
          if existing=$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name'); then
            if ! printf '%s\n' "$existing" | grep -Fxq "$ASSET"; then
              gh release upload "$tag" "$ASSET" --repo "$REPOSITORY"
            fi
          else
            gh release create "$tag" "$ASSET" --repo "$REPOSITORY" --target "$REVISION" --prerelease --latest=false --title "Lean compilation $REVISION" --notes 'Compiled artifacts from successful Build, generated-entry, Test, lint, text-style and production-axiom checks.'
          fi
      - name: Report cache publication
        if: ${{ always() }}
        env:
          RESULT: ${{ steps.publish.outcome }}
        run: |
          printf '## Cache publication\n\n' >> "$GITHUB_STEP_SUMMARY"
          case "$RESULT" in
            success)
              printf '✅ [Native cache for `%.12s`](https://github.com/%s/releases/tag/lean-native-%s)\n' \
                "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY" ;;
            failure) printf '❌ Publication failed. See the job log for details.\n' >> "$GITHUB_STEP_SUMMARY" ;;
            cancelled) printf '⏹ Cancelled\n' >> "$GITHUB_STEP_SUMMARY" ;;
            *) printf '— Skipped\n' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
