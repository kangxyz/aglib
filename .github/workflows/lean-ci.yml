# Minimal adaptation of mathlib4 d13f23b7 build_template.yml.
name: Lean CI

on:
  workflow_call:
    inputs:
      package-directory:
        type: string
        default: .
      build-targets:
        type: string
        required: true
      check-targets:
        type: string
        default: ''
      runner-labels:
        type: string
        default: '["ubuntu-24.04"]'
      reuse-build-host:
        type: boolean
        default: false
      native-memory-mib:
        type: number
        default: 13824
      lake-threads:
        type: number
        default: 1
      build-lake-threads:
        type: number
        default: 0
      lint-workers:
        type: number
        default: 4
      job-timeout-minutes:
        type: number
        default: 360
      build-job-timeout-minutes:
        type: number
        default: 0
      build-compiler-minutes:
        type: number
        default: 0
      first-ci-cache:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  LAKE_NO_CACHE: 'true'
  LAKE_ARTIFACT_CACHE: 'true'
  BUILD_TARGETS: ${{ inputs.build-targets }}

# Keep compiler failures inside the scope so the runner can save partial caches.
defaults:
  run:
    shell: >-
      bash --noprofile --norc -e -o pipefail -c
      "ci_memory_mb=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1048576 - 2048 ));
      if test \"$ci_memory_mb\" -gt 13824; then ci_memory_mb=13824; fi;
      printf \"Native resources: group=%s MiB, Lake threads=1, CPUs=%s\n\" \"$ci_memory_mb\" \"$(nproc)\";
      scope_dir=\"$RUNNER_TEMP/lean-ci-scopes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB\";
      scope=\"lean-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-$(printf '%s' \"$0\" | sha256sum | cut -c1-20).scope\";
      mkdir -p \"$scope_dir\"; printf '%s\n' \"$scope\" > \"$scope_dir/$scope\";
      exec sudo --preserve-env systemd-run --scope --quiet --collect
      --unit=\"$scope\"
      --uid=\"$(id -u)\" --gid=\"$(id -g)\"
      --property=\"MemoryMax=$ci_memory_mb\"M --property=MemorySwapMax=0
      /usr/bin/env \"PATH=$PATH\" LEAN_NUM_THREADS=1
      /bin/bash --noprofile --norc -eo pipefail \"$0\"" "{0}"

jobs:
  build:
    name: Build
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.build-job-timeout-minutes != 0 && inputs.build-job-timeout-minutes || inputs.job-timeout-minutes }}
    env: &native-resource-env
      CI_NATIVE_MEMORY_MIB: ${{ inputs.native-memory-mib }}
      CI_LAKE_THREADS: ${{ inputs.lake-threads }}
      CI_LINT_WORKERS: ${{ inputs.lint-workers }}
    defaults: &native-resource-defaults
      run:
        shell: >-
          bash --noprofile --norc -e -o pipefail -c
          "for ci_resource in \"$CI_NATIVE_MEMORY_MIB\" \"$CI_LAKE_THREADS\" \"$CI_LINT_WORKERS\"; do
          if ! [[ \"$ci_resource\" =~ ^[1-9][0-9]*$ ]]; then
          echo '::error::native-memory-mib, lake-threads and lint-workers must be positive integers.' >&2; exit 2; fi; done;
          ci_available_mb=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1048576 - 2048 ));
          if test \"$ci_available_mb\" -le 0; then
          echo '::error::Physical RAM must exceed the 2048 MiB runner reserve.' >&2; exit 2; fi;
          ci_memory_mb=$CI_NATIVE_MEMORY_MIB;
          ci_memory_digits=$(printf '%s' \"$ci_memory_mb\" | wc -c);
          ci_available_digits=$(printf '%s' \"$ci_available_mb\" | wc -c);
          if test \"$ci_memory_digits\" -gt \"$ci_available_digits\" ||
          test \"$ci_memory_mb\" -gt \"$ci_available_mb\"; then ci_memory_mb=$ci_available_mb; fi;
          printf \"Native resources: group=%s MiB, Lake threads=%s, lint workers=%s, CPUs=%s\n\" \"$ci_memory_mb\" \"$CI_LAKE_THREADS\" \"$CI_LINT_WORKERS\" \"$(nproc)\";
          scope_dir=\"$RUNNER_TEMP/lean-ci-scopes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB\";
          scope=\"lean-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-$(printf '%s' \"$0\" | sha256sum | cut -c1-20).scope\";
          mkdir -p \"$scope_dir\"; printf '%s\n' \"$scope\" > \"$scope_dir/$scope\";
          exec sudo --preserve-env systemd-run --scope --quiet --collect
          --unit=\"$scope\"
          --uid=\"$(id -u)\" --gid=\"$(id -g)\"
          --property=\"MemoryMax=$ci_memory_mb\"M --property=MemorySwapMax=0
          /usr/bin/env \"PATH=$PATH\" \"LEAN_NUM_THREADS=$CI_LAKE_THREADS\" \"CI_LINT_WORKERS=$CI_LINT_WORKERS\"
          /bin/bash --noprofile --norc -eo pipefail \"$0\"" "{0}"
    outputs:
      outcome: ${{ steps.build.outcome }}
      cache-key: ${{ steps.restore.outputs.cache-primary-key }}
      staged: ${{ steps.stage.outputs.staged }}
      local-handoff: ${{ steps.handoff-mode.outputs.enabled }}
      host-runner: ${{ runner.name }}
      root-generation: ${{ steps.pack-root.outputs.generation }}
      stage-sha: ${{ steps.seal.outputs.stage-sha }}
    steps:
      - name: Set Build deadline
        shell: bash
        env:
          JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
          BUILD_JOB_TIMEOUT_MINUTES: ${{ inputs.build-job-timeout-minutes }}
          REQUESTED_COMPILER_MINUTES: ${{ inputs.build-compiler-minutes }}
        run: |
          job_minutes=${BUILD_JOB_TIMEOUT_MINUTES:-0}
          if test "$job_minutes" = 0; then job_minutes=$JOB_TIMEOUT_MINUTES; fi
          reserve=30
          if ! [[ "$job_minutes" =~ ^[1-9][0-9]*$ ]] || ! test "$job_minutes" -gt "$reserve"; then
            echo "::error::Effective Build job timeout must be an integer greater than $reserve." >&2
            exit 2
          fi
          budget_minutes=$((job_minutes - reserve))
          compiler_minutes=${REQUESTED_COMPILER_MINUTES:-0}
          if test "$compiler_minutes" != 0; then
            if ! [[ "$compiler_minutes" =~ ^[1-9][0-9]*$ ]] || ! test "$compiler_minutes" -le "$budget_minutes"; then
              echo '::error::build-compiler-minutes must be 0 or a positive integer within the cache-safe Build budget.' >&2
              exit 2
            fi
          else
            compiler_minutes=$budget_minutes
          fi
          echo "BUILD_COMPILER_MINUTES=$compiler_minutes" >> "$GITHUB_ENV"
          echo "BUILD_DEADLINE=$(( $(date +%s) + budget_minutes * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start native resource sampler
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ inputs.package-directory }}
        env:
          JOB_TIMEOUT_MINUTES: ${{ inputs.build-job-timeout-minutes != 0 && inputs.build-job-timeout-minutes || inputs.job-timeout-minutes }}
          CI_RESOURCE_RUNNER_LABELS: ${{ inputs.runner-labels }}
        run: |
          if test -f .github/ci-resource-monitor.py; then
            python3 .github/ci-resource-monitor.py start --minutes "$JOB_TIMEOUT_MINUTES"
          fi
      - name: Select layered cache support
        id: cache-mode
        working-directory: ${{ inputs.package-directory }}
        env:
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache }}
        run: |
          if test -z "$FIRST_CI_CACHE" && test -f .github/ci-cache/checkpoint.py && \
              test -f .github/ci-cache/stage.py && \
              python3 .github/ci-cache/checkpoint.py supported --root .; then
            echo 'layered=true' >> "$GITHUB_OUTPUT"
            python3 .github/ci-cache/checkpoint.py context --root . --github-output "$GITHUB_OUTPUT"
          fi
      - name: Select native cache directory
        id: handoff-mode
        working-directory: ${{ inputs.package-directory }}
        env:
          REUSE: ${{ inputs.reuse-build-host }}
          LAYERED: ${{ steps.cache-mode.outputs.layered }}
        run: |
          native="$RUNNER_TEMP/lake-native-cache"
          if test "$REUSE" = true && test "$LAYERED" = true; then
            if ! grep -Fxq 'aglib-ci-shared-host-v1' /etc/aglib-ci-runner-mode; then
              echo '::error::Runner has not been provisioned for same-host CI.'
              exit 1
            fi
            sudo systemctl restart aglib-pilot-expiry.timer
            if test -L .lake; then
              echo '::error::Expected a runner-owned .lake directory.'
              exit 1
            fi
            handoff="$PWD/.lake/ci-host-handoff"
            rm -rf -- "$handoff"
            mkdir -p "$handoff"
            native="$handoff/native-cache"
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
          printf 'LAKE_CACHE_DIR=%s\n' "$native" >> "$GITHUB_ENV"
      - name: First promoted-main cache/resource/source gate
        id: first-ci
        if: ${{ inputs.first-ci-cache != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache }}
        run: python3 .github/cache-promotion/promotion.py first-ci
      - name: Restore optional dependencies checkpoint
        id: restore-dependencies
        if: ${{ steps.cache-mode.outputs.layered == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/dependencies.tar.zst
          key: lean-layered-v1-dependencies-${{ steps.cache-mode.outputs.dependencies_context }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-layered-v1-dependencies-${{ steps.cache-mode.outputs.dependencies_context }}-
      - name: Restore optional root checkpoint
        id: restore-root
        if: ${{ steps.cache-mode.outputs.layered == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/root.tar.zst
          key: lean-layered-v1-root-${{ steps.cache-mode.outputs.root_context }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          restore-keys: |
            lean-layered-v1-root-${{ steps.cache-mode.outputs.root_context }}-${{ github.ref }}-
            lean-layered-v1-root-${{ steps.cache-mode.outputs.root_context }}-
      - name: Restore optional tools checkpoint
        id: restore-tools
        if: ${{ steps.handoff-mode.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with: &tools-checkpoint-cache
          path: ${{ runner.temp }}/layered-cache/tools.tar.zst
          key: lean-layered-v1-tools-${{ steps.cache-mode.outputs.tools_context }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-layered-v1-tools-${{ steps.cache-mode.outputs.tools_context }}-${{ github.ref }}-
            lean-layered-v1-tools-${{ steps.cache-mode.outputs.tools_context }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: ${{ steps.cache-mode.outputs.layered != 'true' || steps.restore-dependencies.outcome != 'success' || steps.restore-root.outcome != 'success' || steps.restore-dependencies.outputs.cache-matched-key == '' || steps.restore-root.outputs.cache-matched-key == '' }}
        id: restore
        continue-on-error: ${{ steps.cache-mode.outputs.layered == 'true' }}
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
            ${{ runner.temp }}/lake-native-cache
          key: ${{ inputs.first-ci-cache != '' && steps.first-ci.outputs.seed-key || format('lean-{0}-{1}-{2}-{3}-{4}-{5}-{6}', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory)), hashFiles(format('{0}/lake-manifest.json', inputs.package-directory)), github.sha, github.run_id, github.run_attempt) }}
          fail-on-cache-miss: ${{ inputs.first-ci-cache != '' }}
          # Prefer current pins, then the same Lean; retain existing cache generations as seeds.
          restore-keys: |
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-{2}-{3}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory)), hashFiles(format('{0}/lake-manifest.json', inputs.package-directory))) || '' }}
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory))) || '' }}
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory), format('{0}/lake-manifest.json', inputs.package-directory))) || '' }}
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Revalidate layered support after migration restore
        if: ${{ steps.cache-mode.outputs.layered == 'true' }}
        working-directory: ${{ inputs.package-directory }}
        run: python3 .github/ci-cache/checkpoint.py supported --root .
      - name: Require exact full main seed for first Build
        if: ${{ inputs.first-ci-cache != '' }}
        env:
          HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          EXPECTED: ${{ steps.first-ci.outputs.seed-key }}
        run: test "$HIT" = true && test "$MATCHED" = "$EXPECTED"
      - name: Remove read-only restored archive hash sidecars
        working-directory: ${{ inputs.package-directory }}
        run: &restore-writable-archive-hashes |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import stat

          # Lake rewrites these derived hashes, even when the artifact is immutable.
          # Unlink the sidecar instead of changing permissions on shared cache inodes.
          def owned_directory(path):
              metadata = path.lstat()
              if (not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != os.getuid()
                      or not metadata.st_mode & stat.S_IWUSR):
                  raise SystemExit(f'Unsafe restored build directory: {path}')

          root = Path('.lake/build/ir')
          for parent in (Path('.lake'), Path('.lake/build'), root):
              try:
                  owned_directory(parent)
              except FileNotFoundError:
                  raise SystemExit(0)
          removed = 0
          for directory, children, files in os.walk(root, followlinks=False):
              owned_directory(Path(directory))
              children[:] = [name for name in children
                             if not (Path(directory) / name).is_symlink()]
              for name in files:
                  if not name.endswith('.ltar.hash'):
                      continue
                  path = Path(directory) / name
                  metadata = path.lstat()
                  if stat.S_ISREG(metadata.st_mode) and not metadata.st_mode & stat.S_IWUSR:
                      if metadata.st_uid != os.getuid():
                          raise SystemExit(f'Foreign restored archive hash sidecar: {path}')
                      path.unlink()
                      removed += 1
          print(f'Removed {removed} read-only restored archive hash sidecars; Lake will recompute them.')
          PY
      - name: Configure Lean
        id: lean-setup
        working-directory: ${{ inputs.package-directory }}
        run: |
          installer="$RUNNER_TEMP/elan-init.sh"
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://elan.lean-lang.org/elan-init.sh \
            --output "$installer"
          chmod +x "$installer"
          "$installer" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"

          for attempt in 1 2 3; do
            if LAKE_PATH=$(elan which lake); then
              lean --version
              "$LAKE_PATH" --version
              exit 0
            fi
            if test "$attempt" -lt 3; then
              echo "::warning::Lean toolchain acquisition failed (attempt $attempt/3); retrying."
              sleep "$((attempt * 5))"
            fi
          done
          echo '::error::Lean toolchain acquisition failed after 3 attempts.'
          exit 1
      - name: First-main native no-build readiness before cache tools or production build
        if: ${{ inputs.first-ci-cache != '' }}
        working-directory: ${{ inputs.package-directory }}
        run: bash .github/cache-promotion/ready.sh
      - name: Get Mathlib cache
        working-directory: ${{ inputs.package-directory }}
        run: &mathlib-cache-get lake exe cache get
      - name: Restore published native dependency caches
        working-directory: ${{ inputs.package-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          LAYERED_CACHE: ${{ steps.cache-mode.outputs.layered }}
        run: |
          compiler=$(lean --version)
          domain="$RUNNER_OS-$RUNNER_ARCH-$(sha256sum lean-toolchain | cut -c 1-16)"
          while IFS=$'\t' read -r package repository pin; do
            exact=$(gh api "repos/$repository/releases/tags/lean-native-$pin" 2>/dev/null) || exact=null
            recent=$(gh api "repos/$repository/releases?per_page=20" 2>/dev/null) || recent='[]'
            candidates=$(printf '%s' "$recent" | jq -r --argjson exact "$exact" --arg domain "$domain" '
              [([$exact] + (map(select(.id != $exact.id)) | sort_by(.published_at) | reverse))[] | select(.draft == false)
              | select(.tag_name | test("^lean-native-[0-9a-f]{40}$"))
              | select(.target_commitish == (.tag_name | ltrimstr("lean-native-")))
              | .tag_name as $tag | (.assets | sort_by(.created_at) | reverse)[]
              | select((.name | startswith("lake-native-cache-" + $domain + "-"))
                  or (.name | test("^lake-native-cache-[0-9]+-[0-9]+[.]tar$")))
              | [$tag, .name]][:5][] | @tsv') || candidates=''
            imported=false
            while IFS=$'\t' read -r tag asset; do
              test -n "$tag" || continue
              temporary=$(mktemp -d "$RUNNER_TEMP/native-seed.XXXXXX")
              if gh release download "$tag" --repo "$repository" --pattern "$asset" --dir "$temporary"; then
                archive="$temporary/$asset"
                # Native staging contains flat regular files, never links or nested paths.
                if tar -tvf "$archive" | awk 'substr($1,1,1)!="-" && !(substr($1,1,1)=="d" && $NF=="./") {exit 1}' &&
                    tar -tf "$archive" | awk '!/^(\.\/)?$|^(\.\/)?(outputs[.]jsonl|producer[.]json|[0-9a-f]{16}([.][A-Za-z0-9_.+-]+)?)$/ {bad=1} END {exit bad}'; then
                  mkdir "$temporary/staged"
                  if tar -xf "$archive" -C "$temporary/staged"; then
                    compatible=false
                    if test -f "$temporary/staged/producer.json"; then
                      if jq -e --arg repository "$repository" --arg revision "${tag#lean-native-}" \
                          --arg package "${package#«}" --arg domain "$domain" --arg compiler "$compiler" '
                          .repository == $repository and .revision == $revision
                          and .package == ($package | rtrimstr("»"))
                          and .domain == $domain and .compiler == $compiler' \
                          "$temporary/staged/producer.json" >/dev/null; then compatible=true; fi
                    elif [[ "$asset" =~ ^lake-native-cache-[0-9]+-[0-9]+[.]tar$ ]]; then
                      echo "$package: legacy native seed; current Lake inputs decide applicability."
                      compatible=true
                    fi
                    if "$compatible" && test "${LAYERED_CACHE:-}" = true && test -f .github/ci-cache/stage.py; then
                      if ! python3 .github/ci-cache/stage.py verify --root . --staging "$temporary/staged"; then
                        echo "$package: invalid native module archive; skipping this optional producer."
                        compatible=false
                      fi
                    fi
                    if "$compatible" && lake cache unstage "$temporary/staged" "$package"; then
                      echo "$package: imported $repository producer ${tag#lean-native-} for pin $pin."
                      imported=true
                    fi
                  fi
                fi
              fi
              rm -rf "$temporary"
              "$imported" && break
            done <<< "$candidates"
            "$imported" || echo "$package: no compatible published cache; ordinary incremental build."
          done < <(jq -r '.packages[] | select(.type == "git")
            | select(.url | test("^https://github[.]com/kangxyz/[^/]+/?$"))
            | select(.rev | test("^[0-9a-f]{40}$"))
            | [.name, (.url | sub("^https://github[.]com/"; "") | sub("[.]git/?$"; "") | rtrimstr("/")), .rev]
            | @tsv' lake-manifest.json)
      - name: Validate materialized layered dependencies
        if: ${{ steps.cache-mode.outputs.layered == 'true' }}
        working-directory: ${{ inputs.package-directory }}
        run: python3 .github/ci-cache/checkpoint.py supported --root . --materialized
      - name: Apply optional compilation checkpoints
        if: ${{ steps.cache-mode.outputs.layered == 'true' }}
        working-directory: ${{ inputs.package-directory }}
        run: |
          for layer in tools dependencies root; do
            archive="$RUNNER_TEMP/layered-cache/$layer.tar.zst"
            if test -f "$archive"; then
              if ! python3 .github/ci-cache/checkpoint.py restore --root . --layer "$layer" \
                  --input "$archive" --native-cache "$LAKE_CACHE_DIR"; then
                echo "::warning::Optional $layer checkpoint could not be restored; current inputs will be rebuilt or verified."
              fi
            fi
          done
      - name: Refresh archive hash metadata after cache preparation
        working-directory: ${{ inputs.package-directory }}
        run: *restore-writable-archive-hashes
      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        env:
          CI_LAKE_THREADS: ${{ inputs.build-lake-threads != 0 && inputs.build-lake-threads || inputs.lake-threads }}
        run: |
          read -r -a targets <<< "$BUILD_TARGETS"
          if test "${#targets[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          rm -f "$RUNNER_TEMP/outputs.jsonl"
          remaining=$((BUILD_DEADLINE - $(date +%s)))
          if test "$remaining" -le 0; then
            echo '::warning::Preparation used the safe compilation window. No new compilation checkpoint will be created.'
            exit 124
          fi
          compiler_seconds=$((BUILD_COMPILER_MINUTES * 60))
          if test "$remaining" -lt "$compiler_seconds"; then compiler_seconds=$remaining; fi
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          if timeout --signal=INT --kill-after=60s "${compiler_seconds}s" lake build --rehash "${targets[@]}" -o "$RUNNER_TEMP/outputs.jsonl"; then
            exit 0
          else
            status=$?
          fi
          if test "$status" -eq 124 || test "$status" -eq 137; then
            echo "::warning::Build stopped with timeout/kill status $status at the job's compiler cutoff. Partial outputs will be saved where possible by the following cache steps; rerun this branch to resume the incremental build."
          fi
          exit "$status"
      - name: Quiesce this job's native scopes before cache saving
        id: quiesce
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: &quiesce-native-scopes |
          # Cancellation can end systemd-run while Lake/Lean remain in its scope.
          # Stop only units recorded by this exact run/attempt/job; never scan PIDs.
          prefix="lean-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-"
          directory="$RUNNER_TEMP/lean-ci-scopes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          test ! -L "$directory"
          shopt -s nullglob
          for marker in "$directory"/*.scope; do
            test -f "$marker" && test ! -L "$marker"
            unit=$(basename "$marker")
            case "$unit" in
              "$prefix"*.scope) ;;
              *) echo "::error::Unexpected native scope marker: $unit"; exit 1 ;;
            esac
            test "$(cat "$marker")" = "$unit"
            load=$(sudo systemctl show --property=LoadState --value -- "$unit")
            if test "$load" = not-found; then
              continue  # --collect already removed a scope whose processes exited.
            fi
            # No --no-block: cache readers must wait for the scope's processes.
            if ! sudo systemctl stop -- "$unit"; then
              # A naturally exiting --collect scope can disappear after show.
              load=$(sudo systemctl show --property=LoadState --value -- "$unit")
              if test "$load" = not-found; then continue; fi
              echo "::error::Could not stop native scope: $unit"
              exit 1
            fi
            state=$(sudo systemctl show --property=ActiveState --value -- "$unit")
            if test "$state" != inactive; then
              echo "::error::Native scope did not quiesce: $unit ($state)"
              exit 1
            fi
          done
      - name: Save compilation independently of Test and lint
        if: ${{ inputs.first-ci-cache == '' && steps.cache-mode.outputs.layered != 'true' && always() && steps.quiesce.outcome == 'success' && steps.build.outputs.attempted == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
