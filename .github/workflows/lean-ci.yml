# Minimal adaptation of mathlib4 d13f23b7 build_template.yml.
name: Lean CI

on:
  workflow_call:
    inputs:
      package-directory:
        type: string
        default: .
      build-targets:
        type: string
        required: true
      check-targets:
        type: string
        default: ''
      first-ci-cache:
        type: string
        default: ''
      native-root-producer:
        type: string
        default: ''
      native-root-asset:
        type: string
        default: ''
      native-root-sha256:
        type: string
        default: ''
      native-cache-only:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  LAKE_NO_CACHE: 'true'
  LAKE_ARTIFACT_CACHE: 'true'
  BUILD_TARGETS: ${{ inputs.build-targets }}
  ROOT_NATIVE_PRODUCER: ${{ inputs.native-root-producer }}
  ROOT_NATIVE_ASSET: ${{ inputs.native-root-asset }}
  ROOT_NATIVE_SHA256: ${{ inputs.native-root-sha256 }}
  NATIVE_CACHE_ONLY: ${{ inputs.native-cache-only }}

# Keep compiler failures inside the scope so the runner can save partial caches.
defaults:
  run:
    shell: >-
      bash --noprofile --norc -e -o pipefail -c
      "ci_memory_mb=$(( $(getconf _PHYS_PAGES) * $(getconf PAGE_SIZE) / 1048576 - 2048 ));
      if test \"$ci_memory_mb\" -gt 13824; then ci_memory_mb=13824; fi;
      printf \"Native resources: group=%s MiB, Lake threads=1, CPUs=%s\n\" \"$ci_memory_mb\" \"$(nproc)\";
      scope_dir=\"$RUNNER_TEMP/lean-ci-scopes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB\";
      scope=\"lean-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-$(printf '%s' \"$0\" | sha256sum | cut -c1-20).scope\";
      mkdir -p \"$scope_dir\"; printf '%s\n' \"$scope\" > \"$scope_dir/$scope\";
      exec sudo --preserve-env systemd-run --scope --quiet --collect
      --unit=\"$scope\"
      --uid=\"$(id -u)\" --gid=\"$(id -g)\"
      --property=\"MemoryMax=$ci_memory_mb\"M --property=MemorySwapMax=0
      /usr/bin/env \"PATH=$PATH\" LEAN_NUM_THREADS=1
      /bin/bash --noprofile --norc -eo pipefail \"$0\"" "{0}"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      outcome: ${{ steps.build.outcome }}
      cache-key: ${{ steps.restore.outputs.cache-primary-key }}
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - name: Set Build deadline
        shell: bash
        run: echo "BUILD_DEADLINE=$(( $(date +%s) + 330 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: echo "LAKE_CACHE_DIR=$RUNNER_TEMP/lake-native-cache" >> "$GITHUB_ENV"
      - name: First promoted-main cache/resource/source gate
        id: first-ci
        if: ${{ inputs.first-ci-cache != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache }}
        run: python3 .github/cache-promotion/promotion.py first-ci
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: restore
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
            ${{ runner.temp }}/lake-native-cache
          key: ${{ inputs.first-ci-cache != '' && steps.first-ci.outputs.seed-key || format('lean-{0}-{1}-{2}-{3}-{4}-{5}-{6}', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory)), hashFiles(format('{0}/lake-manifest.json', inputs.package-directory)), github.sha, github.run_id, github.run_attempt) }}
          fail-on-cache-miss: ${{ inputs.first-ci-cache != '' || inputs.native-cache-only }}
          # Prefer current pins, then the same Lean; retain existing cache generations as seeds.
          restore-keys: |
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-{2}-{3}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory)), hashFiles(format('{0}/lake-manifest.json', inputs.package-directory))) || '' }}
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory))) || '' }}
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-{2}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory), format('{0}/lake-manifest.json', inputs.package-directory))) || '' }}
            ${{ inputs.first-ci-cache == '' && format('lean-{0}-{1}-', runner.os, runner.arch) || '' }}
      - name: Require exact full main seed for first Build
        if: ${{ inputs.first-ci-cache != '' }}
        env:
          HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          EXPECTED: ${{ steps.first-ci.outputs.seed-key }}
        run: test "$HIT" = true && test "$MATCHED" = "$EXPECTED"
      - name: Remove read-only restored archive hash sidecars
        working-directory: ${{ inputs.package-directory }}
        run: &restore-writable-archive-hashes |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import stat

          # Lake rewrites these derived hashes, even when the artifact is immutable.
          # Unlink the sidecar instead of changing permissions on shared cache inodes.
          def owned_directory(path):
              metadata = path.lstat()
              if (not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != os.getuid()
                      or not metadata.st_mode & stat.S_IWUSR):
                  raise SystemExit(f'Unsafe restored build directory: {path}')

          root = Path('.lake/build/ir')
          for parent in (Path('.lake'), Path('.lake/build'), root):
              try:
                  owned_directory(parent)
              except FileNotFoundError:
                  raise SystemExit(0)
          removed = 0
          for directory, children, files in os.walk(root, followlinks=False):
              owned_directory(Path(directory))
              children[:] = [name for name in children
                             if not (Path(directory) / name).is_symlink()]
              for name in files:
                  if not name.endswith('.ltar.hash'):
                      continue
                  path = Path(directory) / name
                  metadata = path.lstat()
                  if stat.S_ISREG(metadata.st_mode) and not metadata.st_mode & stat.S_IWUSR:
                      if metadata.st_uid != os.getuid():
                          raise SystemExit(f'Foreign restored archive hash sidecar: {path}')
                      path.unlink()
                      removed += 1
          print(f'Removed {removed} read-only restored archive hash sidecars; Lake will recompute them.')
          PY
      - name: Configure Lean
        id: lean-setup
        working-directory: ${{ inputs.package-directory }}
        run: |
          installer="$RUNNER_TEMP/elan-init.sh"
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://elan.lean-lang.org/elan-init.sh \
            --output "$installer"
          chmod +x "$installer"
          "$installer" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"

          for attempt in 1 2 3; do
            if LAKE_PATH=$(elan which lake); then
              lean --version
              "$LAKE_PATH" --version
              exit 0
            fi
            if test "$attempt" -lt 3; then
              echo "::warning::Lean toolchain acquisition failed (attempt $attempt/3); retrying."
              sleep "$((attempt * 5))"
            fi
          done
          echo '::error::Lean toolchain acquisition failed after 3 attempts.'
          exit 1
      - name: First-main native no-build readiness before cache tools or production build
        if: ${{ inputs.first-ci-cache != '' }}
        working-directory: ${{ inputs.package-directory }}
        run: bash .github/cache-promotion/ready.sh
      - name: Get Mathlib cache
        if: ${{ !inputs.native-cache-only }}
        working-directory: ${{ inputs.package-directory }}
        run: &mathlib-cache-get lake exe cache get
      - name: Restore published native root and dependency caches
        working-directory: ${{ inputs.package-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: &restore-published-native-seeds |
          if test "$NATIVE_CACHE_ONLY" = true; then
            [[ "$ROOT_NATIVE_PRODUCER" =~ ^[0-9a-f]{40}$ && "$ROOT_NATIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$ROOT_NATIVE_ASSET" =~ ^lake-native-cache-Linux-X64-[0-9a-f]{16}-[A-Za-z0-9_.+-]+[.]tar$ ]]
          fi
          compiler=$(lean --version)
          domain="$RUNNER_OS-$RUNNER_ARCH-$(sha256sum lean-toolchain | cut -c 1-16)"
          while IFS=$'\t' read -r package repository pin scope; do
            exact=$(gh api "repos/$repository/releases/tags/lean-native-$pin" 2>/dev/null) || exact=null
            recent=$(gh api "repos/$repository/releases?per_page=20" 2>/dev/null) || recent='[]'
            candidates=$(printf '%s' "$recent" | jq -r --argjson exact "$exact" --arg domain "$domain" '
              [([$exact] + (map(select(.id != $exact.id)) | sort_by(.published_at) | reverse))[] | select(.draft == false)
              | select(.tag_name | test("^lean-native-[0-9a-f]{40}$"))
              | select(.target_commitish == (.tag_name | ltrimstr("lean-native-")))
              | .tag_name as $tag | (.assets | sort_by(.created_at) | reverse)[]
              | select((.name | startswith("lake-native-cache-" + $domain + "-"))
                  or (.name | test("^lake-native-cache-[0-9]+-[0-9]+[.]tar$")))
              | [$tag, .name]][:5][] | @tsv') || candidates=''
            if test "$scope" = root && test -n "$ROOT_NATIVE_ASSET"; then
              candidates=$(printf '%s' "$exact" | jq -r --arg asset "$ROOT_NATIVE_ASSET" --arg pin "$pin" '
                select(.draft == false and .target_commitish == $pin) | .tag_name as $tag
                | .assets[] | select(.name == $asset) | [$tag,.name] | @tsv')
            fi
            imported=false
            while IFS=$'\t' read -r tag asset; do
              test -n "$tag" || continue
              temporary=$(mktemp -d "$RUNNER_TEMP/native-seed.XXXXXX")
              if test "$scope" = root && test "$NATIVE_CACHE_ONLY" = true; then
                bytes=$(printf '%s' "$exact" | jq -er --arg asset "$asset" '.assets[] | select(.name == $asset) | .size')
                python3 .github/cache-promotion/native-root-room.py download "$bytes"
              fi
              if gh release download "$tag" --repo "$repository" --pattern "$asset" --dir "$temporary"; then
                archive="$temporary/$asset"
                if test "$scope" = root && test -n "$ROOT_NATIVE_SHA256"; then
                  test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ROOT_NATIVE_SHA256"
                fi
                if test "$scope" = root && test "$NATIVE_CACHE_ONLY" = true; then
                  python3 .github/cache-promotion/native-root-room.py extract "$archive"
                fi
                # Native staging contains flat regular files, never links or nested paths.
                if tar -tvf "$archive" | awk 'substr($1,1,1)!="-" && !(substr($1,1,1)=="d" && $NF=="./") {exit 1}' &&
                    tar -tf "$archive" | awk '!/^(\.\/)?$|^(\.\/)?(outputs[.]jsonl|producer[.]json|[0-9a-f]{16}([.][A-Za-z0-9_.+-]+)?)$/ {bad=1} END {exit bad}'; then
                  mkdir "$temporary/staged"
                  if tar -xf "$archive" -C "$temporary/staged"; then
                    compatible=false
                    if test -f "$temporary/staged/producer.json"; then
                      if jq -e --arg repository "$repository" --arg revision "${tag#lean-native-}" \
                          --arg package "${package#«}" --arg domain "$domain" --arg compiler "$compiler" '
                          .repository == $repository and .revision == $revision
                          and .package == ($package | rtrimstr("»"))
                          and .domain == $domain and .compiler == $compiler' \
                          "$temporary/staged/producer.json" >/dev/null; then compatible=true; fi
                    elif [[ "$asset" =~ ^lake-native-cache-[0-9]+-[0-9]+[.]tar$ ]]; then
                      echo "$package: legacy native seed; current Lake inputs decide applicability."
                      compatible=true
                    fi
                    if "$compatible" && test "$scope" = root; then
                      if test "$NATIVE_CACHE_ONLY" = true; then
                        jq -e --arg toolchain "$(cat lean-toolchain)" --arg manifest "$(sha256sum lake-manifest.json | cut -d' ' -f1)" \
                          '.toolchain == $toolchain and .manifest_sha256 == $manifest' "$temporary/staged/producer.json"
                        python3 .github/cache-promotion/native-root-room.py unstage "$temporary/staged/producer.json"
                      fi
                      if lake --no-build cache unstage "$temporary/staged" --force-overwrite; then
                        echo "$package: imported root producer ${tag#lean-native-}; consumer $GITHUB_SHA."
                        imported=true
                      elif test "$NATIVE_CACHE_ONLY" = true; then
                        exit 1
                      fi
                    elif "$compatible" && lake cache unstage "$temporary/staged" "$package"; then
                      echo "$package: imported $repository producer ${tag#lean-native-} for pin $pin."
                      imported=true
                    fi
                  fi
                fi
              fi
              rm -rf "$temporary"
              "$imported" && break
            done <<< "$candidates"
            if ! "$imported" && test "$scope" = root && test "$NATIVE_CACHE_ONLY" = true; then
              echo '::error::Required native root/test seed unavailable; no cold compilation.'
              exit 1
            fi
            "$imported" || echo "$package: no compatible published cache; ordinary incremental build."
          done < <(
            package=$(python3 -c 'import tomllib; print(tomllib.load(open("lakefile.toml","rb"))["name"])')
            printf '%s\t%s\t%s\troot\n' "$package" "$GITHUB_REPOSITORY" "${ROOT_NATIVE_PRODUCER:-$GITHUB_SHA}"
            jq -r '.packages[] | select(.type == "git")
            | select(.url | test("^https://github[.]com/kangxyz/[^/]+/?$"))
            | select(.rev | test("^[0-9a-f]{40}$"))
            | [.name, (.url | sub("^https://github[.]com/"; "") | sub("[.]git/?$"; "") | rtrimstr("/")), .rev, "dependency"]
            | @tsv' lake-manifest.json)
      - name: Refresh archive hash metadata after cache preparation
        working-directory: ${{ inputs.package-directory }}
        run: *restore-writable-archive-hashes
      - name: Require delivered production and Test native outputs without compilation
        if: ${{ inputs.native-cache-only }}
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a roots <<< "$BUILD_TARGETS"
          LAKE_RESTORE_ARTIFACTS=true lake build --no-build --rehash "${roots[@]}" AglibTest mathlib/cache batteries/runLinter mathlib/lint-style mathlib/mk_all
      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a targets <<< "$BUILD_TARGETS"
          if test "${#targets[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          remaining=$((BUILD_DEADLINE - $(date +%s)))
          if test "$remaining" -le 0; then
            echo '::warning::The Build job has used its 330-minute compiler budget. Cache saving will still be attempted; rerun this branch to resume from saved partial outputs.'
            exit 124
          fi
          native_flags=()
          if test "$NATIVE_CACHE_ONLY" = true; then native_flags=(--no-build); fi
          if timeout --signal=INT --kill-after=60s "${remaining}s" lake build "${native_flags[@]}" --rehash "${targets[@]}" -o "$RUNNER_TEMP/outputs.jsonl"; then
            exit 0
          else
            status=$?
          fi
          if test "$status" -eq 124 || test "$status" -eq 137; then
            echo "::warning::Build stopped with timeout/kill status $status at the job's compiler cutoff. Partial outputs will be saved where possible by the following cache steps; rerun this branch to resume the incremental build."
          fi
          exit "$status"
      - name: Quiesce this job's native scopes before cache saving
        id: quiesce
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: &quiesce-native-scopes |
          # Cancellation can end systemd-run while Lake/Lean remain in its scope.
          # Stop only units recorded by this exact run/attempt/job; never scan PIDs.
          prefix="lean-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB-"
          directory="$RUNNER_TEMP/lean-ci-scopes/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          test ! -L "$directory"
          shopt -s nullglob
          for marker in "$directory"/*.scope; do
            test -f "$marker" && test ! -L "$marker"
            unit=$(basename "$marker")
            case "$unit" in
              "$prefix"*.scope) ;;
              *) echo "::error::Unexpected native scope marker: $unit"; exit 1 ;;
            esac
            test "$(cat "$marker")" = "$unit"
            load=$(sudo systemctl show --property=LoadState --value -- "$unit")
            if test "$load" = not-found; then
              continue  # --collect already removed a scope whose processes exited.
            fi
            # No --no-block: cache readers must wait for the scope's processes.
            if ! sudo systemctl stop -- "$unit"; then
              # A naturally exiting --collect scope can disappear after show.
              load=$(sudo systemctl show --property=LoadState --value -- "$unit")
              if test "$load" = not-found; then continue; fi
              echo "::error::Could not stop native scope: $unit"
              exit 1
            fi
            state=$(sudo systemctl show --property=ActiveState --value -- "$unit")
            if test "$state" != inactive; then
              echo "::error::Native scope did not quiesce: $unit ($state)"
              exit 1
            fi
          done
      - name: Save compilation independently of Test and lint
        if: ${{ !inputs.native-cache-only && inputs.first-ci-cache == '' && always() && steps.quiesce.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
            ${{ runner.temp }}/lake-native-cache
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Stage completed native outputs
        id: stage
        if: ${{ always() && steps.quiesce.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        working-directory: ${{ inputs.package-directory }}
        env:
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache || (inputs.native-cache-only && 'native-root') || '' }}
        run: |
          if test -s "$RUNNER_TEMP/outputs.jsonl"; then
            if test -n "$FIRST_CI_CACHE"; then python3 .github/cache-promotion/ci-resources.py stage-copy; fi
            lake cache stage "$RUNNER_TEMP/outputs.jsonl" "$RUNNER_TEMP/cache-staging"
            domain="$RUNNER_OS-$RUNNER_ARCH-$(sha256sum lean-toolchain | cut -c 1-16)"
            package=$(python3 -c 'import tomllib; print(tomllib.load(open("lakefile.toml", "rb"))["name"])')
            jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" \
              --arg package "$package" --arg domain "$domain" --arg compiler "$(lean --version)" \
              '{repository: $repository, revision: $revision, package: $package, domain: $domain, compiler: $compiler}' \
              > "$RUNNER_TEMP/cache-staging/producer.json"
            if test -n "$FIRST_CI_CACHE"; then python3 .github/cache-promotion/ci-resources.py stage-tar; fi
            tar -cf "$RUNNER_TEMP/lake-native-cache.tar" -C "$RUNNER_TEMP/cache-staging" .
            echo 'staged=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.stage.outputs.staged == 'true' }}
        with:
          name: cache-staging
          overwrite: true
          path: ${{ runner.temp }}/lake-native-cache.tar
          compression-level: 0
      - name: Stage native dependencies for Test
        if: ${{ steps.build.outcome == 'success' }}
        env:
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache || (inputs.native-cache-only && 'native-root') || '' }}
        run: |
          if test -n "$FIRST_CI_CACHE"; then
            python3 .github/cache-promotion/ci-resources.py dependencies
            blocks=$(jq -er .file_blocks "$RUNNER_TEMP/first-ci-dependency-bound.json")
            (ulimit -f "$blocks"
             tar -cf - -C "$LAKE_CACHE_DIR" artifacts outputs | \
               zstd -T2 -1 -o "$RUNNER_TEMP/build-dependencies.tar.zst")
          else
            tar -cf - -C "$LAKE_CACHE_DIR" artifacts outputs | \
              zstd -T0 -1 -o "$RUNNER_TEMP/build-dependencies.tar.zst"
          fi
      - name: Upload native dependencies for Test
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-dependencies
          overwrite: true
          path: ${{ runner.temp }}/build-dependencies.tar.zst
          if-no-files-found: error
          compression-level: 0
      - name: Report Build result
        if: ${{ always() }}
        env:
          RESULT: ${{ steps.build.outcome }}
        run: |
          printf 'Build: %s\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$RESULT" = success

  test_lint:
    name: Test, lint and axiom audit
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: echo "LAKE_CACHE_DIR=$RUNNER_TEMP/lake-native-cache" >> "$GITHUB_ENV"
      - name: First promoted-main cache/resource/source gate
        id: first-ci
        if: ${{ inputs.first-ci-cache != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache }}
        run: python3 .github/cache-promotion/promotion.py first-ci
      - name: Warm dependency and native compilation outputs
        continue-on-error: ${{ inputs.first-ci-cache == '' && !inputs.native-cache-only }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: restore-cache
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
            ${{ runner.temp }}/lake-native-cache
          key: ${{ inputs.first-ci-cache != '' && needs.build.outputs.cache-key || format('{0}-tests-{1}', needs.build.outputs.cache-key, github.run_attempt) }}
          fail-on-cache-miss: ${{ inputs.first-ci-cache != '' || inputs.native-cache-only }}
          restore-keys: |
            ${{ inputs.first-ci-cache == '' && format('{0}-tests-', needs.build.outputs.cache-key) || '' }}
            ${{ inputs.first-ci-cache == '' && format('{0}', needs.build.outputs.cache-key) || '' }}
            ${{ inputs.native-cache-only && format('lean-{0}-{1}-{2}-{3}-', runner.os, runner.arch, hashFiles(format('{0}/lean-toolchain', inputs.package-directory)), hashFiles(format('{0}/lake-manifest.json', inputs.package-directory))) || '' }}
      - name: Require exact full main seed for first Test
        if: ${{ inputs.first-ci-cache != '' }}
        env:
          HIT: ${{ steps.restore-cache.outputs.cache-hit }}
          MATCHED: ${{ steps.restore-cache.outputs.cache-matched-key }}
          EXPECTED: ${{ steps.first-ci.outputs.seed-key }}
        run: test "$HIT" = true && test "$MATCHED" = "$EXPECTED"
      - name: Remove read-only restored archive hash sidecars
        working-directory: ${{ inputs.package-directory }}
        run: *restore-writable-archive-hashes
      - name: Configure Lean
        id: lean-setup
        working-directory: ${{ inputs.package-directory }}
        run: |
          installer="$RUNNER_TEMP/elan-init.sh"
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://elan.lean-lang.org/elan-init.sh \
            --output "$installer"
          chmod +x "$installer"
          "$installer" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"

          for attempt in 1 2 3; do
            if LAKE_PATH=$(elan which lake); then
              lean --version
              "$LAKE_PATH" --version
              exit 0
            fi
            if test "$attempt" -lt 3; then
              echo "::warning::Lean toolchain acquisition failed (attempt $attempt/3); retrying."
              sleep "$((attempt * 5))"
            fi
          done
          echo '::error::Lean toolchain acquisition failed after 3 attempts.'
          exit 1
      - name: Import the same native root and Test seed on this separate runner
        working-directory: ${{ inputs.package-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: *restore-published-native-seeds
      - name: Materialize imported tests before mandatory production map overlay
        if: ${{ inputs.native-cache-only }}
        working-directory: ${{ inputs.package-directory }}
        run: LAKE_RESTORE_ARTIFACTS=true lake build --no-build --rehash AglibTest
      - name: First-main native no-build readiness before recovery or checker preparation
        if: ${{ inputs.first-ci-cache != '' }}
        working-directory: ${{ inputs.package-directory }}
        run: bash .github/cache-promotion/ready.sh
      - name: Download this run's dependencies on cache miss
        if: &dependency-recovery ${{ steps.restore-cache.outcome != 'success' || steps.restore-cache.outputs.cache-matched-key == '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: build-dependencies
          path: ${{ runner.temp }}/build-dependencies
      - name: Restore this run's dependencies on cache miss
        if: *dependency-recovery
        run: |
          trap 'rm -rf "$RUNNER_TEMP/build-dependencies"' EXIT
          mkdir -p "$LAKE_CACHE_DIR"
          zstd -dc "$RUNNER_TEMP/build-dependencies/build-dependencies.tar.zst" | \
            tar --unlink-first -xf - -C "$LAKE_CACHE_DIR"
      - name: Recover Mathlib dependencies on cache miss
        if: *dependency-recovery
        working-directory: ${{ inputs.package-directory }}
        run: *mathlib-cache-get
      - name: Admit current-run mandatory stage download and unstage resources
        if: ${{ inputs.first-ci-cache != '' || inputs.native-cache-only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/cache-promotion/ci-resources.py test-download
      - name: Download this run's Build outputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: cache-staging
          path: ${{ runner.temp }}/lake-native-cache
      - name: Restore this run's native Build outputs
        id: current-cache
        working-directory: ${{ inputs.package-directory }}
        env:
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache || (inputs.native-cache-only && 'native-root') || '' }}
        run: |
          if test -n "$FIRST_CI_CACHE"; then python3 .github/cache-promotion/ci-resources.py test-extract; fi
          trap 'rm -f "$LAKE_CACHE_DIR/lake-native-cache.tar"' EXIT
          mkdir -p "$RUNNER_TEMP/cache-staging"
          tar -xf "$LAKE_CACHE_DIR/lake-native-cache.tar" -C "$RUNNER_TEMP/cache-staging"
          lake cache unstage "$RUNNER_TEMP/cache-staging" --force-overwrite
      - name: Refresh archive hash metadata after cache preparation
        working-directory: ${{ inputs.package-directory }}
        run: *restore-writable-archive-hashes
      - name: Verify Build outputs without compilation
        id: compiled
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a targets <<< "$BUILD_TARGETS"
          if test "${#targets[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          LAKE_RESTORE_ARTIFACTS=true lake build --no-build --rehash "${targets[@]}"
      - name: Prepare check tools
        id: tools
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        env:
          CHECK_TARGETS: ${{ inputs.check-targets }}
        run: |
          read -r -a targets <<< "$CHECK_TARGETS"
          native_flags=()
          if test "$NATIVE_CACHE_ONLY" = true; then native_flags=(--no-build); fi
          lake build "${native_flags[@]}" batteries/runLinter mathlib/lint-style mathlib/mk_all "${targets[@]}"
      - name: Check generated library entries
        id: imports
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a roots <<< "$BUILD_TARGETS"
          if test "${#roots[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          result=0
          for root in "${roots[@]}"; do
            lake --no-build exe mathlib/mk_all --lib "$root" --check || result=1
          done
          exit "$result"
      - name: Mathlib text style
        id: style
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a roots <<< "$BUILD_TARGETS"
          if test "${#roots[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          lake --no-build exe mathlib/lint-style "${roots[@]}"
      - name: Test
        id: test
        if: ${{ needs.build.result == 'success' && steps.compiled.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        run: |
          if test "$NATIVE_CACHE_ONLY" = true; then lake --no-build test; else lake test; fi
      - name: Lint
        id: lint
        timeout-minutes: 45
        if: ${{ !cancelled() && needs.build.result == 'success' && steps.lean-setup.outcome == 'success' && steps.compiled.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        env:
          CI_LINT_NO_BUILD: ${{ inputs.native-cache-only }}
        run: |
          read -r -a roots <<< "$BUILD_TARGETS"
          if test "${#roots[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          lint_command=(lake --no-build lint "${roots[@]}" -- --trace)
          if test -n "${GITHUB_WORKSPACE:-}" && test -f "$GITHUB_WORKSPACE/.github/lint/run.sh"; then
            lint_command=(bash "$GITHUB_WORKSPACE/.github/lint/run.sh" "${roots[@]}")
          fi
          for attempt in 1 2; do
            if timeout --kill-after=30s 20m env LEAN_ABORT_ON_PANIC=1 "${lint_command[@]}"; then
              exit 0
            else
              status=$?
            fi
            if test "$status" -ne 124 || test "$attempt" -eq 2; then
              exit "$status"
            fi
            echo '::warning::Declaration lint timed out; retrying once.'
          done
      - name: Audit production axioms
        id: axioms
        if: ${{ !cancelled() && needs.build.result == 'success' && steps.lean-setup.outcome == 'success' && steps.compiled.outcome == 'success' }}
        continue-on-error: true
        working-directory: ${{ inputs.package-directory }}
        run: |
          read -r -a roots <<< "$BUILD_TARGETS"
          if test "${#roots[@]}" -eq 0; then
            echo '::error::build-targets must name at least one production root.'
            exit 1
          fi
          # Reuse the pinned source and incremental outputs across Test runs.
          tool="$LAKE_CACHE_DIR/axiom-audit"
          if ! test -d "$tool/.git"; then
            test "$NATIVE_CACHE_ONLY" != true || { echo 'Required cached auditor missing'; exit 1; }
            git clone --depth 1 --branch v0.1.2 https://github.com/leanprover-community/axiom-audit.git "$tool"
          fi
          test "$(git -C "$tool" rev-parse HEAD)" = 46024e005996495c65ef609368e11ab39c4222e3
          cp lean-toolchain "$tool/lean-toolchain"
          if test "$NATIVE_CACHE_ONLY" = true; then
            (cd "$tool" && lake build --no-build --rehash)
          else
            (cd "$tool" && lake build)
          fi
          test -x "$tool/.lake/build/bin/axiom-audit"
          result=0
          for root in "${roots[@]}"; do
            lake env "$tool/.lake/build/bin/axiom-audit" --root "$root" || result=1
          done
          exit "$result"
      - name: Quiesce this job's native scopes before cache saving
        id: quiesce
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: *quiesce-native-scopes
      - name: Admit one persistent updated main cache save
        id: native-save-room
        if: ${{ inputs.native-cache-only && steps.quiesce.outcome == 'success' && (steps.compiled.outcome == 'success' && steps.tools.outcome == 'success' && steps.imports.outcome == 'success' && steps.style.outcome == 'success' && steps.test.outcome == 'success' && steps.lint.outcome == 'success' && steps.axioms.outcome == 'success') }}
        run: python3 .github/cache-promotion/native-root-room.py save
      - name: Save completed Test compilation
        if: ${{ !inputs.native-cache-only && inputs.first-ci-cache == '' && always() && steps.quiesce.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ inputs.package-directory }}/.lake
            ${{ runner.temp }}/lake-native-cache
          key: ${{ needs.build.outputs.cache-key }}-tests-${{ github.run_attempt }}
      - name: Obtain the pinned official SDK for one strict save
        if: ${{ inputs.native-cache-only && steps.native-save-room.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/cache
          ref: 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
          path: .native-save-sdk
          persist-credentials: false
      - name: Install locked SDK without package scripts
        id: native-save-sdk-install
        if: ${{ inputs.native-cache-only && steps.native-save-room.outcome == 'success' }}
        working-directory: .native-save-sdk
        run: npm ci --ignore-scripts --omit=dev --cache "$RUNNER_TEMP/native-save-npm-cache"
      - name: Save one complete cache with enforced compressed-file cap
        id: native-strict-save
        if: ${{ inputs.native-cache-only && steps.native-save-sdk-install.outcome == 'success' }}
        uses: ./.github/cache-promotion/capped-save
        env:
          SDK_DIRECTORY: ${{ github.workspace }}/.native-save-sdk
          CACHE_SAVE_KEY: ${{ needs.build.outputs.cache-key }}-tests-${{ github.run_attempt }}
      - name: Confirm the new persistent main Test cache entry
        if: ${{ inputs.native-cache-only && steps.native-strict-save.outcome == 'success' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED_KEY: ${{ needs.build.outputs.cache-key }}-tests-${{ github.run_attempt }}
          SAVED_ID: ${{ steps.native-strict-save.outputs.cache-id }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f ref=refs/heads/main -f key="$SAVED_KEY" > "$RUNNER_TEMP/final-native-cache.json"
          jq -e --arg key "$SAVED_KEY" --argjson id "$SAVED_ID" '[.actions_caches[] | select(.id == $id and .key == $key and .ref == "refs/heads/main" and .version == "60729729c15d65dc4080956c73ec44cfde33f5da3080769b8a3a093d958db6de" and .size_in_bytes > 0 and .size_in_bytes <= 10000000000)] | length == 1' "$RUNNER_TEMP/final-native-cache.json"
          cat "$RUNNER_TEMP/final-native-cache.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Report Test, lint and axiom results
        if: ${{ always() }}
        env:
          COMPILED: ${{ steps.compiled.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          IMPORTS: ${{ steps.imports.outcome }}
          STYLE: ${{ steps.style.outcome }}
          TEST: ${{ steps.test.outcome }}
          LINT: ${{ steps.lint.outcome }}
          AXIOMS: ${{ steps.axioms.outcome }}
        run: |
          printf 'Build outputs: %s\nCheck tools: %s\nGenerated entries: %s\nText style: %s\nTest: %s\nLint: %s\nAxioms: %s\n' "$COMPILED" "$TOOLS" "$IMPORTS" "$STYLE" "$TEST" "$LINT" "$AXIOMS" >> "$GITHUB_STEP_SUMMARY"
          test "$COMPILED" = success && test "$TOOLS" = success && test "$IMPORTS" = success && test "$STYLE" = success && test "$TEST" = success && test "$LINT" = success && test "$AXIOMS" = success

  upload_cache:
    name: Publish cache
    needs: [build, test_lint]
    if: ${{ needs.build.result == 'success' && needs.test_lint.result == 'success' && needs.build.outputs.staged == 'true' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: lean-cache-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ inputs.first-ci-cache != '' || inputs.native-cache-only }}
        with:
          persist-credentials: false
      - name: Admit mandatory Publish stage download
        if: ${{ inputs.first-ci-cache != '' || inputs.native-cache-only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/cache-promotion/ci-resources.py publish-download
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: cache-staging
      - name: Publish staged compilation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          FIRST_CI_CACHE: ${{ inputs.first-ci-cache || (inputs.native-cache-only && 'native-root') || '' }}
        run: |
          domain=$(tar -xOf lake-native-cache.tar ./producer.json | jq -er \
            --arg repository "$REPOSITORY" --arg revision "$REVISION" \
            'select(.repository == $repository and .revision == $revision).domain')
          ASSET="lake-native-cache-$domain-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar"
          tag="lean-native-$REVISION"
          mv lake-native-cache.tar "$ASSET"
          if test -n "$FIRST_CI_CACHE"; then
            python3 .github/cache-promotion/ci-resources.py publish-upload "$ASSET"
          fi
          if existing=$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name'); then
            if ! printf '%s\n' "$existing" | grep -Fxq "$ASSET"; then
              gh release upload "$tag" "$ASSET" --repo "$REPOSITORY"
            fi
          else
            gh release create "$tag" "$ASSET" --repo "$REPOSITORY" --target "$REVISION" --prerelease --latest=false --title "Lean compilation $REVISION" --notes 'Compiled artifacts from successful Build, generated-entry, Test, lint, text-style and production-axiom checks.'
          fi
