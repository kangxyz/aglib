name: Aglib CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Aglib
