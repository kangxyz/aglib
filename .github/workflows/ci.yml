name: GitHub CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner-profile:
        description: Runner profile for this manual CI trial
        type: choice
        options: [hosted, ec2]
        default: ec2
      ec2-job-minutes:
        description: EC2 only - job minutes including 30 minutes for cache cleanup
        type: choice
        options: ['150', '90']
        default: '90'
      ec2-build-lake-threads:
        description: EC2 only - production Build Lake runtime threads, not frontend process count
        type: choice
        options: ['4', '8']
        default: '8'

permissions:
  contents: read

concurrency:
  # Preserve the existing queue identity when changing the display name.
  group: Aglib CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Aglib
      # The repo-only autoscaler requires this complete label set.
      runner-labels: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && '["self-hosted","linux","x64","aglib-ec2-pilot"]' || '["ubuntu-24.04"]' }}
      native-memory-mib: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 57344 || 13824 }}
      lake-threads: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 4 || 1 }}
      lint-workers: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 4 || 2 }}
      job-timeout-minutes: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && (github.event_name == 'workflow_dispatch' && inputs.ec2-job-minutes == '150' && 150 || 90) || 360 }}
      build-lake-threads: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && (github.event_name == 'workflow_dispatch' && inputs.ec2-build-lake-threads == '4' && 4 || 8) || 0 }}
