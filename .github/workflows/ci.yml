name: Aglib CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Optional older comparison commit (cannot skip unverified changes)
        required: false
        type: string

# Called source/native jobs downgrade this ceiling; only publication writes.
permissions:
  contents: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/lean-ci.yml
    with:
      config: .github/lean-ci.toml
      base: ${{ inputs.base || '' }}
      legacy-dependencies-prefix: third-party
      legacy-dependencies-paths: |
        .lake/packages
      legacy-builds-prefixes: |
        project-build-v1
      legacy-builds-paths: |
        .lake/build
        examples/downstream/.lake/build
