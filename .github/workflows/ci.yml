name: GitHub CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      native-root-producer:
        type: string
      native-root-asset:
        type: string
      native-root-sha256:
        type: string
      native-cache-only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Preserve the existing queue identity when changing the display name.
  group: Aglib CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Aglib
      native-root-producer: ${{ inputs.native-root-producer || '' }}
      native-root-asset: ${{ inputs.native-root-asset || '' }}
      native-root-sha256: ${{ inputs.native-root-sha256 || '' }}
      native-cache-only: ${{ inputs.native-cache-only || false }}
