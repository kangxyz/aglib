name: GitHub CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner-profile:
        description: Runner profile for this manual CI trial
        type: choice
        options: [hosted, ec2]
        default: ec2

permissions:
  contents: read

concurrency:
  # Preserve the existing queue identity when changing the display name.
  group: Aglib CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Aglib
      # The repo-only autoscaler requires this complete label set.
      runner-labels: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && '["self-hosted","linux","x64","aglib-ec2-pilot"]' || '["ubuntu-24.04"]' }}
      native-memory-mib: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 57344 || 13824 }}
      lake-threads: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 8 || 1 }}
      lint-workers: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 8 || 2 }}
      job-timeout-minutes: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 90 || 360 }}
      reuse-build-host: ${{ vars.AGLIB_EC2_SHARED_HOST == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) }}
      build-job-timeout-minutes: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 240 || 0 }}
      build-compiler-minutes: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) && 180 || 0 }}
