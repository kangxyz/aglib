name: GitHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve the existing queue identity when changing the display name.
  group: Aglib CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Aglib
