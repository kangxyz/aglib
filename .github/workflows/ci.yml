name: CI optimized cache repair and cold validation
permissions:
  contents: read
  actions: read
concurrency:
  group: cache-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  producer:
    name: Native producer (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case:
        - cold
        - timeout
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install exact Lean 4.34.1 without compilation caches
      shell: bash
      run: 'curl --fail --silent --show-error --location --retry 2 --max-time 120 https://elan.lean-lang.org/elan-init.sh
        -o "$RUNNER_TEMP/elan-init.sh"

        bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

        export PATH="$HOME/.elan/bin:$PATH"

        lean --version

        '
    - name: Check checkpoint integrity regressions
      run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/ci-cache -p 'test_*.py' -v
    - name: Produce actual native checkpoints
      shell: bash
      env:
        CASE: ${{ matrix.case }}
      run: 'phase=produce

        if test "$CASE" = timeout; then phase=timeout-produce; fi

        timeout --kill-after=15s 8m python3 .github/ci-cache/tests/native_checkpoint.py "$phase" --work "$RUNNER_TEMP/probe"
        --transfer "$RUNNER_TEMP/transfer"

        '
    - name: Exercise native corrupt archive repair
      if: ${{ matrix.case == 'cold' }}
      run: 'python3 .github/ci-cache/tests/stage_repair.py --work "$RUNNER_TEMP/stage-hash" --corruption hash-text

        python3 .github/ci-cache/tests/stage_repair.py --work "$RUNNER_TEMP/stage-truncated" --corruption truncated

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-checkpoint-${{ matrix.case }}
        path: ${{ runner.temp }}/transfer
        compression-level: 0
        retention-days: 7
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: native-producer-evidence-${{ matrix.case }}
        path: '${{ runner.temp }}/probe/*.json

          ${{ runner.temp }}/probe/*.jsonl

          ${{ runner.temp }}/probe/*.log

          '
        compression-level: 0
        retention-days: 7
  consumer:
    name: Fresh Linux consumer (${{ matrix.case }})
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case:
        - cold
        - timeout
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install exact Lean without any Actions cache restore
      shell: bash
      run: 'curl --fail --silent --show-error --location --retry 2 --max-time 120 https://elan.lean-lang.org/elan-init.sh
        -o "$RUNNER_TEMP/elan-init.sh"

        bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

        export PATH="$HOME/.elan/bin:$PATH"

        lean --version

        '
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: native-checkpoint-${{ matrix.case }}
        path: ${{ runner.temp }}/transfer
    - name: Restore across fresh VMs and check actual incremental behavior
      shell: bash
      env:
        CASE: ${{ matrix.case }}
      run: 'phase=consume

        if test "$CASE" = timeout; then phase=timeout-resume; fi

        timeout --kill-after=15s 8m python3 .github/ci-cache/tests/native_checkpoint.py "$phase" --work "$RUNNER_TEMP/probe"
        --transfer "$RUNNER_TEMP/transfer"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: native-consumer-evidence-${{ matrix.case }}
        path: '${{ runner.temp }}/probe/*.json

          ${{ runner.temp }}/probe/*.jsonl

          ${{ runner.temp }}/probe/*.log

          '
        compression-level: 0
        retention-days: 7
  full_packet:
    name: Repair and measure actual production archives
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LAKE_NO_CACHE: 'true'
      LAKE_ARTIFACT_CACHE: 'true'
      LEAN_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 1b737dca122694a54850316097a7ee87ddcbaead
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .ci-control
        persist-credentials: false
    - name: Set native directory and sampling
      shell: bash
      run: 'echo "LAKE_CACHE_DIR=$RUNNER_TEMP/lake-native-cache" >> "$GITHUB_ENV"

        mkdir -p "$RUNNER_TEMP/full-metrics" "$RUNNER_TEMP/full-transfer"

        nohup python3 .ci-control/.github/ci-cache/inventory.py --sample --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/full-metrics/disk.jsonl"
        > "$RUNNER_TEMP/full-metrics/sampler.log" 2>&1 < /dev/null &

        echo "$!" > "$RUNNER_TEMP/full-metrics/sampler.pid"

        '
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: actual-scoped-checkpoints
        run-id: 41579347755
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        path: ${{ runner.temp }}/full-transfer
    - name: Pin toolchain and classify setup scaffolding
      shell: bash
      run: 'curl --fail --silent --show-error --location --retry 2 --max-time 120 https://elan.lean-lang.org/elan-init.sh
        -o "$RUNNER_TEMP/elan-init.sh"

        bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

        export PATH="$HOME/.elan/bin:$PATH"

        lean --version

        lake env true

        '
    - name: Restore old scoped payloads with optimized integrity checks
      shell: bash
      run: "for layer in root tools dependencies; do\n  /usr/bin/time -v -o \"$RUNNER_TEMP/full-metrics/restore-$layer.time\"\
        \ python3 .ci-control/.github/ci-cache/checkpoint.py restore --root . --layer \"$layer\" --input \"$RUNNER_TEMP/full-transfer/$layer.tar.zst\"\
        \ --native-cache \"$LAKE_CACHE_DIR\" > \"$RUNNER_TEMP/full-metrics/restore-$layer.json\"\ndone\npython3 .ci-control/.github/ci-cache/inventory.py\
        \ --root \"$GITHUB_WORKSPACE\" --native-cache \"$LAKE_CACHE_DIR\" --output \"$RUNNER_TEMP/full-metrics/before.json\"\
        \n"
    - name: Selectively repair the two corrupt historical archives without compilation
      shell: bash
      run: "python3 - <<'CODE'\nimport os,stat\nfrom pathlib import Path\nfor p in Path('.lake/build/ir').rglob('*.ltar.hash'):\n\
        \    s=p.lstat()\n    if stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid() and not s.st_mode & stat.S_IWUSR:\n   \
        \     p.unlink()\nCODE\nLAKE_RESTORE_ARTIFACTS=true lake --no-build --rehash build Aglib -o \"$RUNNER_TEMP/full-metrics/current-root.jsonl\"\
        \n/usr/bin/time -v -o \"$RUNNER_TEMP/full-metrics/stage-validation.time\" python3 .ci-control/.github/ci-cache/stage.py\
        \ prepare --root . --mapping \"$RUNNER_TEMP/full-metrics/current-root.jsonl\" --staging \"$RUNNER_TEMP/current-root-stage\"\
        \ --native-cache \"$LAKE_CACHE_DIR\" --build-target Aglib --report \"$RUNNER_TEMP/full-metrics/stage-repair.json\"\
        \ntar -cf \"$RUNNER_TEMP/full-transfer/current-root.tar\" -C \"$RUNNER_TEMP/current-root-stage\" .\n"
    - name: Measure optimized packing and unchanged dependency reuse
      shell: bash
      run: "for layer in root dependencies; do\n  /usr/bin/time -v -o \"$RUNNER_TEMP/full-metrics/pack-$layer.time\" python3\
        \ .ci-control/.github/ci-cache/checkpoint.py pack --root . --layer \"$layer\" --output \"$RUNNER_TEMP/full-transfer/$layer.tar.zst\"\
        \ --native-cache \"$LAKE_CACHE_DIR\" > \"$RUNNER_TEMP/full-metrics/pack-$layer.json\"\ndone\nmkdir -p .lake/ci-cache\n\
        cp \"$RUNNER_TEMP/full-transfer/dependencies.tar.zst.json\" .lake/ci-cache/dependencies.json\n/usr/bin/time -v -o\
        \ \"$RUNNER_TEMP/full-metrics/pack-tools.time\" python3 .ci-control/.github/ci-cache/checkpoint.py pack --root . --layer\
        \ tools --output \"$RUNNER_TEMP/full-transfer/tools.tar.zst\" --native-cache \"$LAKE_CACHE_DIR\" > \"$RUNNER_TEMP/full-metrics/pack-tools.json\"\
        \n"
    - name: Finish measured disk sampling
      if: ${{ always() }}
      shell: bash
      run: 'if test -s "$RUNNER_TEMP/full-metrics/sampler.pid"; then kill "$(cat "$RUNNER_TEMP/full-metrics/sampler.pid")"
        || true; fi

        df -B1 "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/full-metrics/df-final.txt"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: actual-scoped-verified
        path: ${{ runner.temp }}/full-transfer
        compression-level: 0
        retention-days: 7
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: optimized-packing-metrics
        path: ${{ runner.temp }}/full-metrics
        compression-level: 0
        retention-days: 7
  full_cold:
    name: Fresh actual Aglib restore from repaired archives
    needs: full_packet
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LAKE_NO_CACHE: 'true'
      LAKE_ARTIFACT_CACHE: 'true'
      LEAN_NUM_THREADS: '1'
      BUILD_TARGETS: Aglib
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 1b737dca122694a54850316097a7ee87ddcbaead
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: .ci-control
        persist-credentials: false
    - name: Fresh native store and pinned sources
      shell: bash
      run: 'echo "LAKE_CACHE_DIR=$RUNNER_TEMP/EMPTY-native-store" >> "$GITHUB_ENV"

        export LAKE_CACHE_DIR="$RUNNER_TEMP/EMPTY-native-store"

        test ! -e "$LAKE_CACHE_DIR"

        mkdir "$LAKE_CACHE_DIR" "$RUNNER_TEMP/cold-metrics"

        curl --fail --silent --show-error --location --retry 2 --max-time 120 https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"

        bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

        export PATH="$HOME/.elan/bin:$PATH"

        lean --version

        /usr/bin/time -v -o "$RUNNER_TEMP/cold-metrics/source-checkout.time" lake env true

        '
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: actual-scoped-verified
        path: ${{ runner.temp }}/full-transfer
    - name: Restore optional checkpoints before authoritative closure
      shell: bash
      run: "for layer in root tools dependencies; do\n  /usr/bin/time -v -o \"$RUNNER_TEMP/cold-metrics/restore-$layer.time\"\
        \ python3 .ci-control/.github/ci-cache/checkpoint.py restore --root . --layer \"$layer\" --input \"$RUNNER_TEMP/full-transfer/$layer.tar.zst\"\
        \ --native-cache \"$LAKE_CACHE_DIR\" > \"$RUNNER_TEMP/cold-metrics/restore-$layer.json\"\ndone\npython3 - <<'CODE'\n\
        import os,stat\nfrom pathlib import Path\nfor p in Path('.lake/build/ir').rglob('*.ltar.hash'):\n    s=p.lstat()\n\
        \    if stat.S_ISREG(s.st_mode) and s.st_uid==os.getuid() and not s.st_mode & stat.S_IWUSR:\n        p.unlink()\n\
        CODE\nmkdir \"$RUNNER_TEMP/current-root-stage\"\ntar -xf \"$RUNNER_TEMP/full-transfer/current-root.tar\" -C \"$RUNNER_TEMP/current-root-stage\"\
        \nlake cache unstage \"$RUNNER_TEMP/current-root-stage\" --force-overwrite\n"
    - name: Check actual production and checker readiness without compilation
      shell: bash
      run: '/usr/bin/time -v -o "$RUNNER_TEMP/cold-metrics/production.time" env LAKE_RESTORE_ARTIFACTS=true lake --no-build
        --rehash build Aglib > "$RUNNER_TEMP/cold-metrics/production.log" 2>&1

        /usr/bin/time -v -o "$RUNNER_TEMP/cold-metrics/checkers.time" lake --no-build --rehash build batteries/runLinter mathlib/lint-style
        mathlib/mk_all > "$RUNNER_TEMP/cold-metrics/checkers.log" 2>&1

        lake --no-build exe mathlib/mk_all --lib Aglib --check > "$RUNNER_TEMP/cold-metrics/entries.log" 2>&1

        lake --no-build exe mathlib/lint-style Aglib > "$RUNNER_TEMP/cold-metrics/style.log" 2>&1

        lake test > "$RUNNER_TEMP/cold-metrics/test.log" 2>&1

        lake --dir .lake/lint-runner --file lakefile.toml --no-build build batchedLint > "$RUNNER_TEMP/cold-metrics/private-lint.log"
        2>&1

        '
    - name: Run the candidate's pinned auditor source-restore path
      shell: bash
      run: "python3 - <<'CODE'\nimport os,subprocess\nfrom pathlib import Path\nlines=Path('.ci-control/.github/workflows/lean-ci.yml').read_text().splitlines()\n\
        start=next(i for i,s in enumerate(lines) if s.strip()=='id: axioms')\nstart=next(i for i in range(start,len(lines))\
        \ if lines[i].strip()=='run: |')+1\nbody=[]\nfor s in lines[start:]:\n    if s and not s.startswith('          '):\
        \ break\n    body.append(s[10:])\nscript=Path(os.environ['RUNNER_TEMP'])/'audit-current.sh';script.write_text(chr(10).join(body)+chr(10))\n\
        with (Path(os.environ['RUNNER_TEMP'])/'cold-metrics/audit.log').open('w') as log:\n    subprocess.run(['bash','-e','-o','pipefail',str(script)],stdout=log,stderr=subprocess.STDOUT,check=True)\n\
        CODE\n"
    - name: Inventory restored actual data
      if: ${{ always() }}
      run: python3 .ci-control/.github/ci-cache/inventory.py --root "$GITHUB_WORKSPACE" --native-cache "$LAKE_CACHE_DIR" --output
        "$RUNNER_TEMP/cold-metrics/after.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: optimized-cold-restore-metrics
        path: ${{ runner.temp }}/cold-metrics
        compression-level: 0
        retention-days: 7
'on':
  push:
    branches:
    - codex/ci-cache-native-20261103
  workflow_dispatch: null
