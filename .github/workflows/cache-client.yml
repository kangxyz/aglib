name: Native cache client acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Independent of the full library CI queue; never cancel healthy proof builds.
concurrency:
  group: cache-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quillen-client:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 1
      AGLIB_BUILD_THREADS: 2
      AGLIB_LEAN_MEMORY_MB: 12800
      AGLIB_RSS_LIMIT_MB: 13824
      CACHE_CLIENT_EVIDENCE: ${{ runner.temp }}/cache-client-evidence
      QUILLEN_VERIFY_DIR: ${{ runner.temp }}/cache-client-evidence/mathlib
    steps:
      # Root checkout must precede the nested tooling checkout.
      - name: Check out the actual Quillen consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kangxyz/quillen-k-theory
          ref: main
          persist-credentials: false
      - name: Check out this workflow's Aglib tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .cache-tooling
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Record the consumer, tooling and pinned prerequisite basis
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_CLIENT_EVIDENCE"
          python3 - <<'PY' | tee "$CACHE_CLIENT_EVIDENCE/basis.log"
          import json
          import subprocess
          from pathlib import Path
          def revision(root):
              return subprocess.check_output(['git', '-C', root, 'rev-parse', 'HEAD'], text=True).strip()
          def packages(root):
              manifest = json.loads((Path(root) / 'lake-manifest.json').read_text())
              return {p['name']: p['rev'] for p in manifest['packages'] if p['type'] == 'git'}
          consumer, tooling = packages('.'), packages('.cache-tooling')
          assert consumer['mathlib'] == tooling['mathlib'], 'Shared Mathlib cache requires matching pins'
          toolchain = Path('lean-toolchain').read_text().strip()
          assert toolchain == Path('.cache-tooling/lean-toolchain').read_text().strip()
          print(json.dumps({'quillen': revision('.'), 'tooling': revision('.cache-tooling'),
                            'consumer_aglib_pin': consumer['Aglib'], 'mathlib': consumer['mathlib'],
                            'toolchain': toolchain}, indent=2))
          PY
      - name: Install the pinned consumer Lean toolchain
        env:
          ELAN_HOME: ${{ runner.temp }}/elan
        run: |
          set -euo pipefail
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Restore the matching shared Mathlib prerequisite cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake/packages
          key: third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache-tooling/lean-toolchain', '.cache-tooling/lake-manifest.json') }}
      - name: Resolve existing consumer pins and fetch guarded Mathlib prerequisites
        run: |
          set -euo pipefail
          bash scripts/cache.sh --ci 2>&1 | tee "$CACHE_CLIENT_EVIDENCE/mathlib.log"
          git diff --exit-code -- lakefile.toml lake-manifest.json lean-toolchain
      - name: Require an actual public Aglib import into an empty native cache
        run: |
          set -euo pipefail
          export LAKE_CACHE_DIR
          LAKE_CACHE_DIR=$(mktemp -d "$RUNNER_TEMP/cache-client-native.XXXXXX")
          echo "LAKE_CACHE_DIR=$LAKE_CACHE_DIR" >> "$GITHUB_ENV"
          python3 .cache-tooling/.github/actions/lake-cache/cache.py --root . restore \
            --repositories kangxyz/aglib 2>&1 | tee "$CACHE_CLIENT_EVIDENCE/remote-import.log"
          grep -E '^Aglib: imported producer [0-9a-f]{40} for configured pin [0-9a-f]{40};' \
            "$CACHE_CLIENT_EVIDENCE/remote-import.log"
      - name: Require current-source Aglib reuse without compiling upstream proofs
        run: |
          set -euo pipefail
          lake --rehash --no-build build Aglib 2>&1 | tee "$CACHE_CLIENT_EVIDENCE/no-build.log"
      - name: Smoke import the cached Tensor and Span interfaces
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/CacheClientSmoke.lean"
          cat > "$smoke" <<'LEAN'
          module
          import Aglib.AlgebraicGeometry.Cohomology.Godement.Tensor
          import Aglib.AlgebraicGeometry.Cohomology.Godement.Section.Span
          LEAN
          python3 .cache-tooling/scripts/resource_guard.py --capped-toolchain \
            --receipt "$CACHE_CLIENT_EVIDENCE/import-smoke.json" -- \
            lake env lean --root "$RUNNER_TEMP" "$smoke" 2>&1 | tee "$CACHE_CLIENT_EVIDENCE/import-smoke.log"
      - name: Upload cache-client acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CACHE_CLIENT_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 14
